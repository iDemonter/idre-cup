# Сервер Idre Cup: API и своя база Postgres. Запуск и обновление: см. deploy.md.
# Стек изолирован: своё имя проекта, своя сеть, свой том. К другим сервисам на машине он не подключается.
name: idre-cup

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: idrecup
      POSTGRES_USER: idrecup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idrecup -d idrecup"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: postgres://idrecup:${POSTGRES_PASSWORD}@db:5432/idrecup
    ports:
      # Только на самой машине. Наружу сервер выходит через туннель, порт на роутере не открываем.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Свой туннель Cloudflare: публичный HTTPS-адрес → http://api:8080 по сети стека.
  # Hostname задаётся в Cloudflare Zero Trust, токен туннеля лежит в .env (CLOUDFLARE_TUNNEL_TOKEN).
  # Профиль tunnel: включается строкой COMPOSE_PROFILES=tunnel в .env, без неё сервис не стартует.
  # Наружу только исходящее соединение cloudflared, порт на роутере не нужен.
  cloudflared:
    # Версия закреплена: туннель — единственный вход для телефонов, «latest» не берём.
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      api:
        condition: service_healthy
    # Токен через переменную окружения, а не аргументом: в списке процессов его не видно.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

volumes:
  db-data:
