# Запуск на мини-ПК:  cp .env.example .env  →  поменять пароль  →  docker compose up -d --build
# Проверка:           curl http://127.0.0.1:8080/health

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: idrecup
      POSTGRES_USER: idrecup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idrecup -d idrecup"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: postgres://idrecup:${POSTGRES_PASSWORD}@db:5432/idrecup
    ports:
      # Только локально. Наружу сервер выходит через туннель, порт на роутере не открываем.
      - "127.0.0.1:8080:8080"

  # Туннель наружу подключим отдельным шагом, когда появится домен:
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     TUNNEL_TOKEN: ${TUNNEL_TOKEN}

volumes:
  db-data:
