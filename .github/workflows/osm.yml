name: Данные трасс

# Скачивает трассы и подъёмники Idre Fjäll из OpenStreetMap и кладёт их в data/osm-idre.json.
# Запускается вручную или при изменении скрипта.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/fetch_osm.py"
      - ".github/workflows/osm.yml"

permissions:
  contents: write

concurrency:
  group: osm
  cancel-in-progress: false

jobs:
  fetch:
    name: Скачать данные OpenStreetMap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Скачать трассы и подъёмники
        run: python3 tools/fetch_osm.py

      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm-idre.json
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "Данные OpenStreetMap: трассы и подъёмники Idre Fjäll"
            git push
          fi
