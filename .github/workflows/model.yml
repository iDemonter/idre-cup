name: 3D-модель курорта

# Собирает 3D-модель другого курорта (не Idre) для вида «Модель»: высоты Copernicus DEM,
# окружение из OpenStreetMap, трассы из каталога курортов. Настройки — tools/models.json.
# Кладёт data/dem-<курорт>.json, data/osm-land-<курорт>.json и Resources/*-<курорт>.* в репозиторий.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Курорт из tools/models.json"
        default: are
  push:
    branches: [main]
    paths:
      - "tools/models.json"
      - "tools/build_terrain.py"
      - "tools/build_resort_pistes.py"
      - "tools/official/approx.json"
      - "tools/fetch_dem.py"
      - ".github/workflows/model.yml"

permissions:
  contents: write

concurrency:
  group: model
  cancel-in-progress: false

jobs:
  build:
    name: Собрать модель
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # По умолчанию собираются все модели, кроме Idre (у неё свои workflow «Данные высот» и «Данные трасс»).
      MODELS: ${{ inputs.model || 'are vemdalsskalet bjornrike klovsjo-storhogna' }}
    steps:
      - uses: actions/checkout@v4

      - name: Поставить библиотеки
        run: python3 -m pip install --quiet rasterio numpy scipy pillow

      - name: Высоты, окружение, трассы, рельеф
        run: |
          for model in $MODELS; do
            echo "::group::$model"
            python3 tools/fetch_dem.py "$model"
            python3 tools/fetch_osm.py "$model"
            python3 tools/build_resort_pistes.py "$model"
            python3 tools/build_terrain.py "$model"
            echo "::endgroup::"
            sleep 20   # Overpass не любит частые запросы
          done

      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for model in $MODELS; do
            git add "data/dem-$model.json" "data/osm-land-$model.json" app/IdreCup/Resources/*-"$model".*
          done
          if git diff --cached --quiet; then
            echo "Модели не изменились"
          else
            git commit -m "3D-модели курортов: $MODELS"
            git pull --rebase
            git push
          fi
