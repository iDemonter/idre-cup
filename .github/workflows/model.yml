name: 3D-модель курорта

# Собирает 3D-модель другого курорта (не Idre) для вида «Модель»: высоты Copernicus DEM,
# окружение из OpenStreetMap, трассы из каталога курортов. Настройки — tools/models.json.
# Кладёт data/dem-<курорт>.json, data/osm-land-<курорт>.json и Resources/*-<курорт>.* в репозиторий.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Курорт из tools/models.json"
        default: are
  push:
    branches: [main]
    paths:
      - "tools/models.json"
      - "tools/build_terrain.py"
      - "tools/build_resort_pistes.py"
      - ".github/workflows/model.yml"

permissions:
  contents: write

concurrency:
  group: model
  cancel-in-progress: false

jobs:
  build:
    name: Собрать модель
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODEL: ${{ inputs.model || 'are' }}
    steps:
      - uses: actions/checkout@v4

      - name: Поставить библиотеки
        run: python3 -m pip install --quiet rasterio numpy scipy pillow

      - name: Высоты
        run: python3 tools/fetch_dem.py "$MODEL"

      - name: Окружение из OpenStreetMap
        run: python3 tools/fetch_osm.py "$MODEL"

      - name: Трассы и подъёмники
        run: python3 tools/build_resort_pistes.py "$MODEL"

      - name: Рельеф, раскраска, лес и дома
        run: python3 tools/build_terrain.py "$MODEL"

      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/dem-$MODEL.json" "data/osm-land-$MODEL.json" app/IdreCup/Resources/*-"$MODEL".*
          if git diff --cached --quiet; then
            echo "Модель не изменилась"
          else
            git commit -m "3D-модель курорта $MODEL: рельеф, раскраска, окружение, трассы"
            git pull --rebase
            git push
          fi
