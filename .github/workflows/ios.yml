name: iOS

# Mac для разработки нет, поэтому всё собирается здесь.
# 1. «Проверочная сборка» — компиляция под симулятор, без подписи и без секретов.
# 3. «Снимки экрана» — приложение запускается в симуляторе, снимки кладутся в ветку screenshots.
#    По ним проверяется, как выглядит карта: Mac и симулятора под рукой нет.
# 2. «TestFlight» — архив, подпись облачным сертификатом Apple и отправка в TestFlight.
#    Запускается только из ветки main и только если заданы секреты репозитория.

on:
  push:
    branches: [main, "dev/**"]
    paths:
      - "app/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Проверочная сборка
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Создать проект Xcode
        run: |
          which xcodegen || brew install xcodegen
          cd app
          xcodegen generate

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Сборка под симулятор
        run: |
          set -o pipefail
          # Ошибки компиляции дублируются аннотациями: их видно через API GitHub без входа,
          # а сам журнал сборки без входа не открыть.
          xcodebuild build \
            -project app/IdreCup.xcodeproj \
            -scheme IdreCup \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet 2>&1 | tee build.log || {
              grep -E 'error:' build.log | sort -u | head -40 \
                | sed -E "s#^$PWD/##; s#^([^:]+):([0-9]+):([0-9]+): error: (.*)\$#::error file=\1,line=\2::\4#; t; s#^#::error::#"
              exit 1
            }

  screenshots:
    name: Снимки экрана
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write   # снимки кладутся в ветку screenshots
    steps:
      - uses: actions/checkout@v4

      - name: Сборка под симулятор
        run: |
          which xcodegen || brew install xcodegen
          (cd app && xcodegen generate)
          xcodebuild build \
            -project app/IdreCup.xcodeproj \
            -scheme IdreCup \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Сервер с демо-кубком
        continue-on-error: true
        run: |
          brew install postgresql@17 >/dev/null
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          brew services start postgresql@17
          for attempt in $(seq 1 90); do pg_isready -q && break; sleep 1; done
          createdb idrecup || { sleep 10; createdb idrecup; }
          cd server
          npm ci --omit=dev >/dev/null
          PORT=8080 AUTO_EVENTS=0 DATABASE_URL="postgres://$(whoami)@127.0.0.1:5432/idrecup" nohup node src/index.js > ../server.log 2>&1 &
          for attempt in $(seq 1 90); do curl -fsS http://127.0.0.1:8080/health 2>/dev/null | grep -q '"db":true' && break; sleep 1; done
          # Если демо-кубок не получился, файла demo.json быть не должно: снимки кубка тогда пропускаются,
          # а причина попадает в ветку screenshots (demo-log.txt), где её видно без входа в GitHub.
          if DATABASE_URL="postgres://$(whoami)@127.0.0.1:5432/idrecup" node tools/seed-demo.js http://127.0.0.1:8080 > ../demo.json 2> ../seed-error.txt; then
            echo "демо-кубок создан" > ../demo-log.txt
          else
            rm -f ../demo.json
            { echo "демо-кубок не создан"; cat ../seed-error.txt; echo "--- сервер:"; tail -20 ../server.log; } > ../demo-log.txt
          fi
          cd ..
          [ -f demo.json ] || exit 0
          # Двум участникам ставим аватар из значка приложения, чтобы на снимках были и картинки, и буквы.
          ICON=$(ls app/IdreCup/Assets.xcassets/AppIcon.appiconset/*.png | head -1)
          sips -Z 256 -s format jpeg "$ICON" --out avatar.jpg >/dev/null
          for NAME in Иван Анна; do
            TOKEN=$(python3 -c "import json,sys; print(json.load(open('demo.json'))['tokens'][sys.argv[1]])" "$NAME")
            curl -fsS -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: image/jpeg" --data-binary @avatar.jpg http://127.0.0.1:8080/v1/me/avatar
          done
          cat server.log | tail -5

      - name: Снимки экрана в симуляторе
        timeout-minutes: 16
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/IdreCup.app
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          phones = [d for runtime, group in sorted(devices.items()) if 'iOS' in runtime for d in group if d['name'].startswith('iPhone')]
          plain = [d for d in phones if 'Pro' not in d['name'] and 'Plus' not in d['name'] and 'SE' not in d['name'] and 'e' != d['name'][-1]]
          print((plain or phones)[-1]['udid'])
          ")
          echo "$DEVICE" > device.txt
          xcrun simctl boot "$DEVICE"
          perl -e 'alarm shift; exec @ARGV' 420 xcrun simctl bootstatus "$DEVICE" -b || echo "::warning::Симулятор не подтвердил загрузку за 7 минут"
          perl -e 'alarm shift; exec @ARGV' 180 xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl privacy "$DEVICE" grant location com.idemonter.idrecup
          mkdir -p shots
          # Симулятор на общей машине иногда зависает: каждой команде даём не больше минуты,
          # а о сбое сообщаем предупреждением (его видно через API без входа в GitHub).
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          shoot() {
            # $1 = имя файла, $2 = сколько секунд ждать, остальное = параметры запуска
            name="$1"; pause="$2"; shift 2
            limit 60 xcrun simctl launch "$DEVICE" com.idemonter.idrecup "$@" || echo "::warning::Снимок $name: приложение не запустилось"
            sleep "$pause"
            limit 60 xcrun simctl io "$DEVICE" screenshot "shots/$name.png" || echo "::warning::Снимок $name: не снят"
            limit 60 xcrun simctl terminate "$DEVICE" com.idemonter.idrecup || true
          }
          echo "::notice::Симулятор запущен, приложение установлено"
          shoot model-overview 25 -look Модель
          shoot model-nord-demo 12 -look Модель -preset Nord -demo YES
          shoot model-area 20 -look Модель -preset "Весь район"
          shoot model-himmel 20 -look Модель -preset Himmelfjäll
          shoot model-vast-home 12 -look Модель -preset Väst -homeLat 61.88634 -homeLon 12.83393
          # Камера нарочно поставлена вверх ногами: на снимке модель должна стоять как обычно.
          shoot model-flip 12 -look Модель -preset Nord -flipTest YES
          shoot day-demo 10 -section day -demo YES
          shoot satellite-vast-home 25 -look Спутник -preset Väst -homeLat 61.88634 -homeLon 12.83393

          # Связка с сервером: демо-кубок на сервере, запущенном прямо здесь.
          if [ -f demo.json ]; then
            SERVER=http://127.0.0.1:8080
            TOKEN=$(python3 -c "import json; print(json.load(open('demo.json'))['tokens']['Иван'])")
            shoot join 10 -section rating -serverURL $SERVER
            shoot rating-day 12 -section rating -serverURL $SERVER -token "$TOKEN"
            shoot rating-week 12 -section rating -ratingTab week -serverURL $SERVER -token "$TOKEN"
            shoot rating-crowns 12 -section rating -ratingTab crowns -serverURL $SERVER -token "$TOKEN"
            shoot profile 12 -section rating -showProfile YES -serverURL $SERVER -token "$TOKEN"
            shoot duels 12 -section duels -serverURL $SERVER -token "$TOKEN"
            shoot evening 12 -section evening -serverURL $SERVER -token "$TOKEN"
            shoot duels-new 12 -section duels -newDuel YES -serverURL $SERVER -token "$TOKEN"
            shoot model-trail 25 -look Модель -preset Nord -selectTrail 28 -serverURL $SERVER -token "$TOKEN"
            shoot model-friends 25 -look Модель -preset Ost -serverURL $SERVER -token "$TOKEN"
            shoot satellite-friends 30 -look Спутник -preset Ost -serverURL $SERVER -token "$TOKEN"
          fi

      # Live Activity: карточка экрана блокировки (та же вёрстка, показанная внутри приложения)
      # и Dynamic Island: приложение запускает проверочную карточку, затем уходит в фон.
      - name: Снимки Live Activity
        continue-on-error: true
        run: |
          DEVICE=$(cat device.txt)
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          limit 60 xcrun simctl launch "$DEVICE" com.idemonter.idrecup -livePreview YES
          sleep 8
          limit 60 xcrun simctl io "$DEVICE" screenshot shots/live-card.png
          limit 60 xcrun simctl terminate "$DEVICE" com.idemonter.idrecup
          limit 60 xcrun simctl launch "$DEVICE" com.idemonter.idrecup -liveTest YES
          sleep 8
          limit 60 xcrun simctl launch "$DEVICE" com.apple.Preferences
          sleep 5
          limit 60 xcrun simctl io "$DEVICE" screenshot shots/live-island.png
          limit 60 xcrun simctl terminate "$DEVICE" com.idemonter.idrecup || true

      - name: Сохранить снимки в ветку screenshots
        if: always()
        run: |
          mkdir -p shots
          cp demo-log.txt shots/ 2>/dev/null || true
          cd shots
          ls -la
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Снимки экрана последней сборки ($GITHUB_SHA, ветка $GITHUB_REF_NAME). Ветка перезаписывается при каждой сборке." > README.md
          git add -A
          git commit -q -m "Снимки экрана: $GITHUB_SHA"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

  testflight:
    name: TestFlight
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Проверить секреты
        id: check
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::notice::Отправка в TestFlight пропущена. Не заданы секреты:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Создать проект Xcode
        if: steps.check.outputs.ready == 'true'
        run: |
          which xcodegen || brew install xcodegen
          cd app
          xcodegen generate

      - name: Подготовить ключ App Store Connect
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      # Архив без подписи: на одноразовой машине нельзя создавать сертификат разработчика,
      # иначе каждый запуск плодил бы новые сертификаты до лимита Apple.
      - name: Архив
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project app/IdreCup.xcodeproj \
            -scheme IdreCup \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/IdreCup.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet 2>&1 | tee archive.log || {
              # Причина сбоя дублируется аннотациями: журнал без входа в GitHub не открыть.
              grep -E 'error: ' archive.log | sort -u | head -20 | sed -E 's#^.*error: #::error::Архив: #'
              exit 1
            }

      # Подпись облачным сертификатом Apple и отправка. Нужен ключ с ролью Admin.
      - name: Подпись и отправка в TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/IdreCup.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log || {
              grep -iE 'error' export.log | sort -u | head -20 | sed -E 's#^#::error::Подпись и отправка: #'
              exit 1
            }
          echo "::notice::Сборка $BUILD_NUMBER отправлена в TestFlight. Обработка у Apple занимает 5–20 минут."

      - name: Удалить ключ
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
