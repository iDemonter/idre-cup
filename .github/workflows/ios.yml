name: iOS

# Mac для разработки нет, поэтому всё собирается здесь.
# 1. «Проверочная сборка» — компиляция под симулятор, без подписи и без секретов.
#    Затем приложение запускается в симуляторе, снимки экрана кладутся в ветку screenshots.
# 2. «TestFlight» — архив, подпись облачным сертификатом Apple и отправка в TestFlight.
#    Запускается только из ветки main и только если заданы секреты репозитория.

on:
  push:
    branches: [main, "dev/**"]
    paths:
      - "app/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write   # нужно только для ветки screenshots

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Проверочная сборка
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Создать проект Xcode
        run: |
          which xcodegen || brew install xcodegen
          cd app
          xcodegen generate

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Сборка под симулятор
        run: |
          xcodebuild build \
            -project app/IdreCup.xcodeproj \
            -scheme IdreCup \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Снимки экрана в симуляторе
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/IdreCup.app
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          phones = [d for runtime, group in sorted(devices.items()) if 'iOS' in runtime for d in group if d['name'].startswith('iPhone')]
          plain = [d for d in phones if 'Pro' not in d['name'] and 'Plus' not in d['name'] and 'SE' not in d['name'] and 'e' != d['name'][-1]]
          print((plain or phones)[-1]['udid'])
          ")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl privacy "$DEVICE" grant location com.idemonter.idrecup
          mkdir -p shots
          shoot() {
            # $1 = имя файла, остальное = параметры запуска
            name="$1"; shift
            xcrun simctl launch "$DEVICE" com.idemonter.idrecup "$@"
            sleep 25
            xcrun simctl io "$DEVICE" screenshot "shots/$name.png"
            xcrun simctl terminate "$DEVICE" com.idemonter.idrecup
          }
          shoot model-overview -look Модель
          shoot model-nord -look Модель -preset Nord
          shoot model-vast -look Модель -preset Väst
          shoot model-ost -look Модель -preset Ost
          shoot model-syd -look Модель -preset Syd
          shoot satellite-nord -look Спутник -preset Nord

      - name: Сохранить снимки в ветку screenshots
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          cd shots
          ls -la
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Снимки экрана последней сборки ($GITHUB_SHA, ветка $GITHUB_REF_NAME). Ветка перезаписывается при каждой сборке." > README.md
          git add -A
          git commit -q -m "Снимки экрана: $GITHUB_SHA"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

  testflight:
    name: TestFlight
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Проверить секреты
        id: check
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::notice::Отправка в TestFlight пропущена. Не заданы секреты:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Создать проект Xcode
        if: steps.check.outputs.ready == 'true'
        run: |
          which xcodegen || brew install xcodegen
          cd app
          xcodegen generate

      - name: Подготовить ключ App Store Connect
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      # Архив без подписи: на одноразовой машине нельзя создавать сертификат разработчика,
      # иначе каждый запуск плодил бы новые сертификаты до лимита Apple.
      - name: Архив
        if: steps.check.outputs.ready == 'true'
        run: |
          xcodebuild archive \
            -project app/IdreCup.xcodeproj \
            -scheme IdreCup \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/IdreCup.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # Подпись облачным сертификатом Apple и отправка. Нужен ключ с ролью Admin.
      - name: Подпись и отправка в TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/IdreCup.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Сборка $BUILD_NUMBER отправлена в TestFlight. Обработка у Apple занимает 5–20 минут."

      - name: Удалить ключ
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
