name: IdreCup
options:
  bundleIdPrefix: com.idemonter
  deploymentTarget:
    iOS: "18.1"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  IdreCup:
    type: application
    platform: iOS
    sources:
      - path: IdreCup
      - path: Shared
    dependencies:
      - target: IdreCupLive
      - target: IdreCupWatch
    info:
      path: IdreCup/Info.plist
      properties:
        CFBundleDisplayName: Idre Cup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Idre Cup записывает ваш трек на склоне: по нему считаются скорость, спуски и рейтинг."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Idre Cup записывает ваш трек на склоне, даже когда телефон в кармане: по нему считаются скорость, спуски и рейтинг."
        UIBackgroundModes:
          - location
        # Live Activity «запись идёт»; обновляется чаще обычного, пока пишется трек.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Префикс команды для общей связки ключей с виджетом (WidgetShare.swift).
        AppIdentifierPrefix: $(AppIdentifierPrefix)
    # Общая связка ключей: приложение пишет место и очки, виджет и кнопка записи читают. Первая группа — своя (токен).
    entitlements:
      path: IdreCup/IdreCup.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.idemonter.idrecup
          - $(AppIdentifierPrefix)com.idemonter.idrecup.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idemonter.idrecup
        PRODUCT_NAME: IdreCup
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
  # Расширение: Live Activity (экран блокировки, Dynamic Island), виджет «Место в кубке» и кнопка записи для Пункта управления. Общий код с приложением лежит в Shared.
  IdreCupLive:
    type: app-extension
    platform: iOS
    sources:
      - path: IdreCupLive
      - path: Shared
    info:
      path: IdreCupLive/Info.plist
      properties:
        CFBundleDisplayName: Idre Cup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppIdentifierPrefix: $(AppIdentifierPrefix)
    entitlements:
      path: IdreCupLive/IdreCupLive.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.idemonter.idrecup.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idemonter.idrecup.live
        PRODUCT_NAME: IdreCupLive
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
  # Пульт на часах: старт, пауза, стоп и цифры дня. GPS пишет телефон.
  IdreCupWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: IdreCupWatch
      - path: Shared/Design/Tokens.swift
      - path: Shared/Format.swift
    info:
      path: IdreCupWatch/Info.plist
      properties:
        CFBundleDisplayName: Idre Cup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.idemonter.idrecup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idemonter.idrecup.watchkitapp
        PRODUCT_NAME: IdreCupWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
schemes:
  IdreCup:
    build:
      targets:
        IdreCup: all
    run:
      config: Debug
    archive:
      config: Release
